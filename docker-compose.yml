version: '3.8'
services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  web:
    image: oven/bun:edge
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file:
      - .env
    ports:
      - '3000:3000'
    command: bash -lc "bun install && bun run dev"
    depends_on:
      - redis

  worker_explanations:
    image: oven/bun:edge
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file:
      - .env
    command: bash -lc "bun install && bun run worker:explanations"
    depends_on:
      - redis

  worker_notifications:
    image: oven/bun:edge
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file:
      - .env
    command: bash -lc "bun install && bun run worker:notifications"
    depends_on:
      - redis

  worker_scheduler:
    image: oven/bun:edge
    working_dir: /app
    volumes:
      - ./:/app:cached
    env_file:
      - .env
    command: bash -lc "bun install && bun run worker:scheduler"
    depends_on:
      - redis
